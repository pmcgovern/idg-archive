<!DOCTYPE html>
<html lang="en">
<head>

  

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computerworld Archive Browser</title>
    
<style>
:root { --accent: #58a6ff; }
/* ═══════════════════════════════════════
   IDG Archive — Shared Design System
   ═══════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0d1117;
  color: #e6edf3;
  min-height: 100vh;
}

/* ── Nav bar ── */
#archive-nav {
  background: #010409;
  border-bottom: 1px solid #21262d;
  padding: 10px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 9999;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
#archive-nav a.home-btn {
  color: #7d8590;
  text-decoration: none;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border: 1px solid #30363d;
  border-radius: 6px;
  transition: color 0.15s, border-color 0.15s;
}
#archive-nav a.home-btn:hover { color: #e6edf3; border-color: #7d8590; }
#archive-nav .nav-divider { color: #30363d; font-size: 18px; }
#archive-nav .nav-title { color: #e6edf3; font-size: 13px; font-weight: 600; }
#archive-nav .nav-accent {
  margin-left: auto;
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 10px;
  font-weight: 600;
}

/* ── Header ── */
header {
  padding: 36px 28px 32px;
  border-bottom: 1px solid #21262d;
  color: white;
}
header h1 { font-size: clamp(22px, 4vw, 36px); margin-bottom: 6px; letter-spacing: -0.5px; }
header h1 span { opacity: 0.7; }
.subtitle { color: #7d8590; font-size: 14px; margin-bottom: 20px; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.stat {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 13px;
  color: #c9d1d9;
}
.stat strong { color: white; }

/* ── Controls bar ── */
.controls {
  background: #161b22;
  padding: 12px 20px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
  border-bottom: 1px solid #21262d;
  position: sticky;
  top: 45px;
  z-index: 100;
}
.filter-group { display: flex; align-items: center; gap: 8px; }
.filter-group label { color: #7d8590; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
select, input[type="text"] {
  background: #0d1117;
  border: 1px solid #30363d;
  color: #e6edf3;
  padding: 7px 12px;
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
}
select:focus, input:focus { outline: none; border-color: #58a6ff; }

/* ── Decade pills ── */
.decade-pills { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 20px; background: #0d1117; border-bottom: 1px solid #21262d; }
.decade-pill {
  background: #161b22;
  border: 1px solid #30363d;
  color: #7d8590;
  padding: 4px 12px;
  border-radius: 14px;
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}
.decade-pill:hover { color: #e6edf3; border-color: #7d8590; }
.decade-pill.active { color: white; border-color: var(--accent, #58a6ff); background: rgba(88,166,255,0.1); }

/* ── Issue grid ── */
.issues-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
  padding: 20px;
  max-width: 1400px;
  margin: 0 auto;
}
.issue-card {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 10px;
  padding: 16px 18px;
  text-decoration: none;
  color: inherit;
  display: block;
  transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
}
.issue-card:hover {
  border-color: var(--accent, #58a6ff);
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
.issue-date { font-size: 11px; color: var(--accent, #58a6ff); font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px; text-transform: uppercase; }
.issue-meta { font-size: 12px; color: #7d8590; margin-bottom: 8px; }
.issue-headlines { list-style: none; }
.issue-headlines li { font-size: 13px; color: #c9d1d9; padding: 3px 0; border-bottom: 1px solid #21262d; line-height: 1.4; }
.issue-headlines li:last-child { border-bottom: none; }
.issue-headlines li::before { content: '›'; color: var(--accent, #58a6ff); margin-right: 6px; }
.no-headlines { font-size: 12px; color: #484f58; font-style: italic; }

/* ── Load more ── */
.load-more-btn {
  display: block;
  margin: 24px auto;
  background: #21262d;
  border: 1px solid #30363d;
  color: #e6edf3;
  padding: 10px 28px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-family: inherit;
  transition: background 0.15s;
}
.load-more-btn:hover { background: #30363d; }

/* ── Empty / error ── */
.empty { text-align: center; padding: 60px 20px; color: #7d8590; font-size: 15px; }
.error { text-align: center; padding: 40px; color: #f85149; }

/* ── Wayback badge ── */
.wayback-badge {
  display: inline-block;
  background: rgba(88,166,255,0.1);
  color: #58a6ff;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 8px;
  font-weight: 600;
  margin-left: 6px;
  vertical-align: middle;
}

header { background: linear-gradient(135deg, #0d1117 0%, #1a73e822 100%); border-bottom: 2px solid #1a73e8; }
.decade-pill.active { background: #1a73e822; border-color: #58a6ff; color: white; }
</style>
<style id="cw-readability">
/* Archive.org view links - make subtle not bright blue */
.issue-card a, a.view-link { 
  color: #484f58 !important; 
  font-size: 11px !important;
}
.issue-card a:hover { color: #58a6ff !important; }

/* Make headline text slightly brighter */
.issue-headlines li { color: #c9d1d9 !important; font-size: 13px !important; }
.issue-headlines li::before { color: #58a6ff; }

/* Soften card borders slightly */
.issue-card { border-color: #21262d !important; }
.issue-card:hover { border-color: #1a73e8 !important; }
</style>
</head>
<body>
    <header>
        <h1>📰 Computerworld <span>Archive Browser</span></h1>
        <p class="subtitle">IDG's flagship publication • 1967–2026 • Internet Archive + Wayback Machine</p>
        <div class="stats" id="stats">Loading stats...</div>
    </header>
    
    <div class="controls">
        <div class="decade-pills" id="decade-pills"></div>
        <div class="filter-group">
            <label for="search">Search:</label>
            <div class="search-wrapper">
                <input type="text" id="search" placeholder="Search headlines...">
                <button class="search-clear" id="search-clear" title="Clear search">×</button>
            </div>
        </div>
        <div class="filter-group">
            <label for="sort">Sort:</label>
            <select id="sort">
                <option value="date-asc">Date (oldest first)</option>
                <option value="date-desc">Date (newest first)</option>
                <option value="headlines">Most headlines</option>
            </select>
        </div>
    </div>
    
    <main>
        <div id="results-info"></div>
        <div class="issues-grid" id="issues-grid">
            <div class="loading">Loading archive data...</div>
        </div>
        <button id="load-more" style="display:none;">Load More</button>
    </main>
    
    <footer>
        Built with data from the <a href="https://archive.org/details/computerworld" target="_blank">Internet Archive Computerworld Collection</a>.
        All content belongs to its respective rights holders.
    </footer>

    <script>
        let allIssues = [];
        let filteredIssues = [];
        let displayedCount = 0;
        let currentSearch = '';
        const PAGE_SIZE = 50;
        
        async function loadData() {
            try {
                const response = await fetch('issues_v7.json');
                if (!response.ok) throw new Error('Failed to load data');
                allIssues = await response.json();
                
                updateStats();
                buildDecadePills();
                applyFilters();
                
            } catch (err) {
                document.getElementById('issues-grid').innerHTML = 
                    `<div class="error">Error loading data: ${err.message}<br><small>Make sure issues_v6.json is in the same directory.</small></div>`;
            }
        }
        
        function updateStats() {
            const totalHeadlines = allIssues.reduce((sum, i) => sum + i.headlines.length, 0);
            const decades = {};
            allIssues.forEach(i => {
                const decade = i.date.substring(0, 3) + '0s';
                decades[decade] = (decades[decade] || 0) + 1;
            });
            const yearRange = allIssues.length > 0 
                ? `${allIssues[0].date.substring(0,4)}–${allIssues[allIssues.length-1].date.substring(0,4)}`
                : '';
            
            document.getElementById('stats').innerHTML = `
                <span class="stat"><strong>${allIssues.length.toLocaleString()}</strong> issues</span>
                <span class="stat"><strong>${totalHeadlines.toLocaleString()}</strong> headlines extracted</span>
                <span class="stat"><strong>${Object.keys(decades).length}</strong> decades covered</span>
                <span class="stat"><strong>${yearRange}</strong> date range</span>
            `;
        }
        
        function buildDecadePills() {
            const decades = {};
            allIssues.forEach(i => {
                const decade = i.date.substring(0, 3) + '0s';
                decades[decade] = (decades[decade] || 0) + 1;
            });
            
            const sorted = Object.entries(decades)
                .filter(([d]) => d.match(/^(19|20)/))
                .sort((a, b) => a[0].localeCompare(b[0]));
            
            const container = document.getElementById('decade-pills');
            container.innerHTML = `<button class="decade-pill active" data-decade="all">All</button>`;
            
            sorted.forEach(([decade, count]) => {
                const btn = document.createElement('button');
                btn.className = 'decade-pill';
                btn.dataset.decade = decade;
                btn.textContent = `${decade} (${count})`;
                container.appendChild(btn);
            });
            
            container.addEventListener('click', e => {
                if (e.target.classList.contains('decade-pill')) {
                    container.querySelectorAll('.decade-pill').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    applyFilters();
                }
            });
        }
        
        function applyFilters() {
            const activeDecade = document.querySelector('.decade-pill.active')?.dataset.decade || 'all';
            currentSearch = document.getElementById('search').value.toLowerCase().trim();
            const sortBy = document.getElementById('sort').value;
            
            // Update clear button visibility
            const clearBtn = document.getElementById('search-clear');
            clearBtn.classList.toggle('visible', currentSearch.length > 0);
            
            filteredIssues = allIssues.filter(issue => {
                if (activeDecade !== 'all') {
                    const issueDecade = issue.date.substring(0, 3) + '0s';
                    if (issueDecade !== activeDecade) return false;
                }
                if (currentSearch) {
                    const headlineText = issue.headlines.join(' ').toLowerCase();
                    if (!headlineText.includes(currentSearch)) return false;
                }
                return true;
            });
            
            filteredIssues.sort((a, b) => {
                if (sortBy === 'date-asc') return a.date.localeCompare(b.date);
                if (sortBy === 'date-desc') return b.date.localeCompare(a.date);
                if (sortBy === 'headlines') return b.headlines.length - a.headlines.length;
                return 0;
            });
            
            displayedCount = 0;
            document.getElementById('issues-grid').innerHTML = '';
            
            if (filteredIssues.length === 0) {
                document.getElementById('issues-grid').innerHTML = 
                    `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#999;">No issues found matching your criteria.</div>`;
            }
            
            loadMore();
            updateResultsInfo();
        }
        
        function updateResultsInfo() {
            const info = document.getElementById('results-info');
            const shown = Math.min(displayedCount, filteredIssues.length);
            info.textContent = `Showing ${shown.toLocaleString()} of ${filteredIssues.length.toLocaleString()} issues`;
        }
        
        function loadMore() {
            const grid = document.getElementById('issues-grid');
            const endIndex = Math.min(displayedCount + PAGE_SIZE, filteredIssues.length);
            
            for (let i = displayedCount; i < endIndex; i++) {
                grid.appendChild(createIssueCard(filteredIssues[i]));
            }
            
            displayedCount = endIndex;
            updateResultsInfo();
            
            const loadMoreBtn = document.getElementById('load-more');
            if (displayedCount < filteredIssues.length) {
                loadMoreBtn.style.display = 'block';
                loadMoreBtn.textContent = `Load More (${(filteredIssues.length - displayedCount).toLocaleString()} remaining)`;
            } else {
                loadMoreBtn.style.display = 'none';
            }
        }
        
        function highlightText(text, search) {
            if (!search) return escapeHtml(text);
            const escaped = escapeHtml(text);
            const searchEscaped = search.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${searchEscaped})`, 'gi');
            return escaped.replace(regex, '<mark>$1</mark>');
        }
        
        function createIssueCard(issue) {
            const card = document.createElement('div');
            card.className = 'issue-card';
            
            const dateObj = new Date(issue.date + 'T00:00:00');
            const formattedDate = dateObj.toLocaleDateString('en-US', {
                year: 'numeric', month: 'long', day: 'numeric'
            });
            
            const volIssue = issue.volume && issue.issue 
                ? `Vol. ${issue.volume}, No. ${issue.issue}`
                : issue.volume ? `Vol. ${issue.volume}` : '';
            
            let headlinesHtml;
            if (issue.headlines.length > 0) {
                // When searching, show only matching headlines
                let displayHeadlines = issue.headlines;
                if (currentSearch) {
                    displayHeadlines = issue.headlines.filter(h => 
                        h.toLowerCase().includes(currentSearch)
                    );
                    if (displayHeadlines.length === 0) displayHeadlines = issue.headlines.slice(0, 3);
                }
                
                headlinesHtml = `<ul class="headlines">
                    ${displayHeadlines.slice(0, 5).map(h => `<li>${highlightText(h, currentSearch)}</li>`).join('')}
                    ${displayHeadlines.length > 5 ? `<li style="color:#999">+ ${displayHeadlines.length - 5} more...</li>` : ''}
                </ul>`;
            } else {
                headlinesHtml = `<p class="no-headlines">No headlines extracted</p>`;
            }
            
            card.innerHTML = `
                <div class="issue-header">
                    <span class="issue-date">${formattedDate}</span>
                    <span class="issue-vol">${volIssue}</span>
                </div>
                <div class="issue-body">
                    ${headlinesHtml}
                    <a href="${issue.url}" target="_blank" rel="noopener" class="archive-link">
                        📚 View on Archive.org
                    </a>
                </div>
            `;
            
            return card;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function debounce(fn, delay) {
            let timeout;
            return (...args) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => fn(...args), delay);
            };
        }
        
        // Event listeners
        document.getElementById('search').addEventListener('input', debounce(applyFilters, 300));
        document.getElementById('sort').addEventListener('change', applyFilters);
        document.getElementById('load-more').addEventListener('click', loadMore);
        document.getElementById('search-clear').addEventListener('click', () => {
            document.getElementById('search').value = '';
            applyFilters();
        });
        
        loadData();
    </script>
</body>
</html>
